nodeLinker: node-modules

enableGlobalCache: true

# Use the traditional node_modules layout instead of Plug'n'Play.
# Reason: Docusaurus 3.x on recent Node hits resolution issues inside the PnP
# loader; the node-modules linker sidesteps them cleanly (matches the
# pdf-data-extractor-docs sibling site this repo was templated from).

# Supply-chain cooldown DISABLED (owner directive): lets package managers reach
# TRUE latest with no just-published quarantine. Do NOT revert.
npmMinimalAgeGate: 0
