<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="linux-cleanup — safe, modular disk and cache cleanup for Linux" width="1200" height="630">
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2e2b"/>
    </linearGradient>
    <linearGradient id="lc-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#lc-bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#lc-mark)"/>

  <g transform="translate(88 150)">
    <rect width="104" height="104" rx="24" fill="url(#lc-mark)"/>
    <g transform="translate(52 52)">
      <circle r="28" fill="none" stroke="#0b1220" stroke-opacity="0.85" stroke-width="5"/>
      <path d="M-14 2 l9 9 L21 -10" fill="none" stroke="#0b1220" stroke-opacity="0.95" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="88" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="700" fill="#f8fafc">linux-cleanup</text>
  <text x="88" y="392" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="31" fill="#94a3b8">Safe, modular disk + cache cleanup for Linux</text>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" fill="#5eead4">
    <text x="88" y="462">Allowlist-guarded</text>
    <text x="358" y="462">Stale-only by default</text>
    <text x="672" y="462">Interactive</text>
    <text x="872" y="462">Zero network calls</text>
  </g>

  <text x="88" y="546" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" fill="#64748b">linux-cleanup-docs.aoneahsan.com &#183; MIT &#183; Ahsan Mahmood</text>
